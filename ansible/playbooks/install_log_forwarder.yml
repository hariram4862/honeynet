---
# =============================================================================
# Honeynet — Fluent Bit Log Forwarder
#
# Installs and configures Fluent Bit on honeypot nodes to ship Cowrie JSON
# logs directly to the centralized S3 log sink.
#
# Fluent Bit has a native S3 output plugin — lightweight, cloud-native,
# industry standard for exactly this use case.
#
# Usage:
#   ansible-playbook -i inventory.ini ansible/playbooks/install_log_forwarder.yml \
#     -e "s3_bucket=honeynet-threat-log-sink aws_region=us-east-1 sensor_id=aws-us-east-1"
# =============================================================================

- name: Install and configure Fluent Bit log forwarder
  hosts: honeypots
  become: true

  vars:
    cowrie_log_path: "/home/cowrie/cowrie/var/log/cowrie/cowrie.json"
    sensor_id: "{{ sensor_id | default('unknown-sensor') }}"
    aws_region: "{{ aws_region | default('us-east-1') }}"
    s3_bucket: "{{ s3_bucket }}"
    fluent_bit_version: "3.0"

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Add Fluent Bit GPG key
      apt_key:
        url: https://packages.fluentbit.io/fluentbit.key
        state: present

    - name: Add Fluent Bit apt repository
      apt_repository:
        repo: "deb https://packages.fluentbit.io/ubuntu/focal focal main"
        state: present
        filename: fluent-bit

    - name: Install Fluent Bit
      apt:
        name: fluent-bit
        state: present
        update_cache: true

    - name: Deploy Fluent Bit configuration
      template:
        src: ../templates/fluent-bit.conf.j2
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Fluent Bit

    - name: Enable and start Fluent Bit
      systemd:
        name: fluent-bit
        enabled: true
        state: started

  handlers:
    - name: Restart Fluent Bit
      systemd:
        name: fluent-bit
        state: restarted
