- hosts: all
  become: yes

  tasks:
    - name: Install dependencies
      apt:
        name:
          - git
          - python3
          - python3-venv
        state: present
        update_cache: yes

    - name: Clone Cowrie honeypot
      git:
        repo: https://github.com/cowrie/cowrie.git
        dest: /opt/cowrie